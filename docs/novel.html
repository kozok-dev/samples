<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>novel</title>
<style>
body {
	margin: 0;
	background-color: #000;
	font-family: serif;
	user-select: none;
}

/* 画像 */
#visualContainer {
	position: fixed;
	width: 100%;
	height: 100vh;
}
#visualContainerSub {
	position: absolute;
	filter: blur(10px);
	transition: filter 0.2s;
}
#visual, #visualSub, #visual > *, #visualSub > * {
	display: none;
	position: absolute;
	width: 100%;
	height: 100%;
	top: 0;
	left: 0;
}

/* テキスト */
#textContainer {
	position: fixed;
	background-color: rgba(0, 0, 0, 0.3);
	box-shadow: 0 0 2vh rgba(0, 0, 0, 0.3);
}
#text {
	margin: 0 auto;
	padding-top: 0.7em;
	color: rgba(255, 255, 255, 0.8);
	filter: drop-shadow(0 0 0.2vw #000);
}

/* Startボタン */
#startBtn {
	position: fixed;
	top: 50%;
	left: 50%;
	padding: 0.5em 1em;
	color: #008;
	font-size: 3vw;
	background-color: rgba(255, 255, 255, 0.5);
	letter-spacing: 0.1em;
	border-radius: 0.3em;
	box-shadow: 0 0 2vw rgba(0, 0, 0, 0.5);
	cursor: pointer;
	pointer-events: none;
	transition: background-color 0.2s, box-shadow 0.5s;
	animation: startBtnAnim 2s linear infinite;
}
#startBtn:hover {
	background-color: rgba(255, 255, 255, 0.7);
	box-shadow: 0 0 2vw rgba(0, 0, 0, 0.3);
}
#startBtn:active {
	background-color: rgba(255, 255, 255, 0.9);
	box-shadow: 0 0 2vw rgba(0, 0, 0, 0.1);
}
@keyframes startBtnAnim {
	0% {
		transform: translate(-50%, -50%) scale(1);
	}
	50% {
		transform: translate(-50%, -50%) scale(1.1);
	}
	100% {
		transform: translate(-50%, -50%) scale(1);
	}
}

/* ログ */
#logBtn {
	display: none;
	position: fixed;
	color: rgba(255, 255, 255, 0.5);
	background-color: rgba(255, 255, 255, 0.2);
	text-align: center;
	border-radius: 0.3em;
	cursor: pointer;
	opacity: 0;
	transition: background-color 0.2s, opacity 0.2s;
}
#logBtn:hover {
	background-color: rgba(255, 255, 255, 0.4);
}
#logBtn:active {
	background-color: rgba(255, 255, 255, 0.6);
}

#logContainer {
	display: none;
	position: fixed;
	width: 100%;
	height: 100vh;
	top: 0;
	left: 0;
	background-color: rgba(0, 0, 0, 0.3);
	opacity: 0;
	backdrop-filter: blur(10px);
	transition: opacity 0.2s;
}
#log {
	position: fixed;
	min-width: 300px;
	height: 80dvh;
	min-height: 300px;
	top: 50dvh;
	left: 50%;
	padding: 1em;
	color: rgba(255, 255, 255, 0.8);
	background-color: rgba(0, 0, 0, 0.3);
	border-radius: 0.3em;
	box-sizing: border-box;
	box-shadow: 0 0 2vh rgba(0, 0, 0, 0.3);
	transform: translate(-50%, -50%);
}
#logText {
	position: relative;
	margin: 0;
	padding: 0;
	height: 90%;
	list-style: none;
	overflow: auto;
	scrollbar-color: rgba(0, 0, 0, 0.3);
}
#logText::-webkit-scrollbar {
	background-color: rgba(0, 0, 0, 0.3);
	border-radius: 0.5em;
}
#logText::-webkit-scrollbar-thumb {
	background-color: rgba(255, 255, 255, 0.2);
	border-radius: 0.5em;
}
#logText::-webkit-scrollbar-thumb:hover {
	background-color: rgba(255, 255, 255, 0.25);
}
#logText > li {
	display: grid;
	margin: 0 0.5em 0.2em 0;
	padding: 0.2em;
	background-color: rgba(0, 0, 0, 0.3);
	cursor: pointer;
	grid-template-columns: 5em 1fr;
	gap: 1em;
	transition: background-color 0.1s;
}
#logText > li:last-child {
	margin-bottom: 0;
}
#logText > li:hover {
	background-color: rgba(30, 30, 30, 0.3);
}
#logText > li:active, #logText > li.active {
	background-color: rgba(60, 60, 60, 0.3);
}
#logText .no {
	text-align: right;
}

#logFooter {
	display: flex;
	margin-top: 0.5em;
	height: 10%;
	justify-content: center;
	align-items: center;
}
#logFooter > div {
	margin: 0 1em;
	padding: 0.2em 1em;
	background-color: rgba(255, 255, 255, 0.2);
	border-radius: 0.3em;
	box-shadow: 0 0 1vw rgba(255, 255, 255, 0.2);
	cursor: pointer;
	transition: background-color 0.2s, box-shadow 0.5s;
}
#logFooter > div:hover {
	background-color: rgba(255, 255, 255, 0.4);
	box-shadow: 0 0 1vw rgba(255, 255, 255, 0.4);
}
#logFooter > div:active {
	background-color: rgba(255, 255, 255, 0.6);
	box-shadow: 0 0 1vw rgba(255, 255, 255, 0.6);
}
</style>
</head>

<body>
<audio id="bgm" loop></audio>
<audio id="snd"></audio>

<div id="visualContainer">
	<div id="visualContainerSub">
		<div id="visual">
			<img>
			<video muted playsinline disablepictureinpicture oncontextmenu="return false"></video>
			<div></div>
		</div>
		<div id="visualSub">
			<img>
			<video muted playsinline disablepictureinpicture oncontextmenu="return false"></video>
			<div></div>
		</div>
	</div>
</div>

<div id="textContainer">
	<div id="text"></div>
</div>

<div id="startBtn">Start</div>

<div id="logBtn"></div>
<div id="logContainer">
	<div id="log">
		<ul id="logText">
			<li>
				<div class="no"></div>
				<div class="text"></div>
			</li>
		</ul>
		<div id="logFooter">
			<div id="autoTextBtn">Auto</div>
			<div id="logCloseBtn">Close</div>
		</div>
	</div>
</div>

<script>
//
// 音声
//
const audios = {
	bgm: document.getElementById("bgm"),
	snd: document.getElementById("snd")
};
let audioStop = {};
let continueSnd = 0;

async function setAudio(type, file, tick, step) {
	if (audioStop[type] != null) audioStop[type]();

	const audio = audios[type];

	if (!audio.paused) {
		try {
			// 音声フェードアウト
			await new Promise((resolve, reject) => {
				step = step || 10;
				tick = (tick || 200) / step;
				let vol = audio.volume;

				audioStop[type] = (flag) => {
					clearInterval(audio.dataset.timer);
					audioStop[type] = null;
					if (flag) {
						resolve();
					} else {
						reject();
					}
				};

				audio.dataset.timer = setInterval(() => {
					vol -= 1 / step;
					if (vol > 0) {
						audio.volume = vol;
					} else {
						audio.volume = 0;
						audio.pause();

						if (audioStop[type] != null) audioStop[type](true);
					}
				}, tick);
			});
		} catch {
			return;
		}
	}

	if (!file) return;
	audio.src = file;
	audio.volume = audio.dataset.volume || 1.0;
	await audio.play();
}

//
// 視覚
//
const visuals = [
	document.getElementById("visual"),
	document.getElementById("visualSub")
];
let visualIndex = 0;

// 画像
async function setImg(files, tick, tickImg) {
	if (typeof(files) == "string") files = [files];
	if (!isValidFile(files)) return;

	const {visual, visualSub, child: img} = getVisuals("img");

	clearInterval(img.dataset.timer);
	let index = 0;
	img.src = files[index];
	await img.decode();

	if (files.length > 1) {
		img.dataset.timer = setInterval(() => {
			index = (index + 1) % files.length;
			img.src = files[index];
		}, tickImg || 200);
	}

	await setVisual(visual, visualSub, tick);
}

// 動画
async function setVideo(file, tick, loop) {
	if (!isValidFile(file)) return;

	const {visual, visualSub, child: video} = getVisuals("video");

	video.src = file;
	video.loop = loop;
	await video.play();

	await setVisual(visual, visualSub, tick);
}

// 色
async function setColor(color, tick) {
	const {visual, visualSub, child: div} = getVisuals("div");

	div.style.backgroundColor = color;

	await setVisual(visual, visualSub, tick);
}

// クロスフェード用に2つの要素を取得
function getVisuals(type) {
	const visual = visuals[visualIndex];
	visualIndex = visualIndex == 0 ? 1 : 0;
	const visualSub = visuals[visualIndex];

	visual.style.zIndex = 0;
	visualSub.style.zIndex = -1;

	for (let elem of visual.querySelectorAll(`:scope > :not(${type})`)) {
		elem.style.display = "none";
	}

	const child = visual.querySelector(`:scope > ${type}`);
	child.style.display = "block";

	return {visual, visualSub, child};
}

// クロスフェードで視覚設定
async function setVisual(visual, visualSub, tick) {
	visual.style.display = "block";
	adjustSize(visual);

	await visual.animate({opacity: [0, 1]}, tick || 200).finished;
	visual.style.opacity = 1;

	const imgSub = visualSub.querySelector(":scope > img");
	const videoSub = visualSub.querySelector(":scope > video");

	clearInterval(imgSub.dataset.timer);
	imgSub.src = "";
	videoSub.src = "";

	visualSub.style.display = "none";
}

// 有効なファイルかどうか
function isValidFile(files) {
	if (typeof(files) == "string") files = [files];

	for (let file of files) {
		const url = new URL(file, location.origin);
		if (location.origin != url.origin) return false;
	}

	return true;
}

//
// テキスト
//
const text = document.getElementById("text");
let isAutoText = false;
let nextText, autoTextTimer;

async function setText(str) {
	if (nextText != null) nextText();

	logBtn.style.opacity = 0;
	logBtn.style.pointerEvents = "none";
	await text.animate({opacity: [1, 0]}, 50).finished;

	// テキスト音声
	let sec;
	if (str) {
		const {text, snd} = getTextSnd(str);
		str = text;
		if (snd) {
			await setAudio("snd", snd);
			sec = audios.snd.duration;
		}
	}
	if (!sec && continueSnd == 0) setAudio("snd");
	if (continueSnd > 0) continueSnd--;

	setSafeHtml(text, str || "");

	await text.animate({opacity: [0, 1]}, 50).finished;
	if (str) {
		logBtn.style.opacity = 1;
		logBtn.style.pointerEvents = "auto";
	}

	if (startIndex == null) return;

	return new Promise(resolve => {
		nextText = (index) => {
			nextText = null;
			clearTimeout(autoTextTimer);
			resolve(index);
		};
		if (isAutoText) autoNextText(sec);
	});
}

document.addEventListener("click", () => {
	if (nextText != null) nextText();
});
document.addEventListener("keyup", event => {
	if (nextText == null) return;
	if (event.key == "Enter" || event.key == "ArrowRight") {
		nextText();
	} else if (event.key == "ArrowLeft") {
		// 1つ前のテキストに戻る
		let index = scriptIndex - 1;
		while (index >= 0 && scripts[index].startsWith("/")) index--;
		if (index >= 0) nextText(index);
	}
});

// 自動でテキストを進める
function autoNextText(sec) {
	let tick;
	if (sec) {
		tick = sec * 1000 + 500;
	} else {
		// sec未指定の場合、テキストから時間を計算
		const textLen = scripts[scriptIndex].replace(/<[^>]*>/g, "").length;
		tick = textLen * 150 + 1000;
	}

	clearTimeout(autoTextTimer);
	autoTextTimer = setTimeout(() => {
		nextText();
	}, Math.max(tick, 1000));
}

// テキストと音声を取得
function getTextSnd(text) {
	const index = text.lastIndexOf("/snd:");
	if (index < 0) return {text, snd: null};

	const snd = text.substring(index + 5);
	text = text.substring(0, index);
	return {text, snd};
}

// テキストにHTMLを設定
function setSafeHtml(elem, text) {
	if (elem.setHTML) {
		elem.setHTML(text, {sanitizer: new Sanitizer({allowAttributes: ["style"]})});
	} else {
		elem.innerHTML = text.replace(/<[^>]*>/g, tag => {
			return tag.replace(/data|embed|iframe|link|meta|object|script|url|\son\w*/gi, "");
		});
	}
}

//
// ログ
//
const logBtn = document.getElementById("logBtn");
const logContainer = document.getElementById("logContainer");
const log = document.getElementById("log");
const logText = document.getElementById("logText");
const autoTextBtn = document.getElementById("autoTextBtn");
const logCloseBtn = document.getElementById("logCloseBtn");

logBtn.addEventListener("click", event => {
	isAutoText = false;
	clearTimeout(autoTextTimer);
	logBtn.textContent = "";

	logContainer.style.display = "block";

	// ログテキストの位置を現在のテキストする
	const activeText = logText.querySelector(`:scope > [data-no="${scriptIndex}"]`);
	logText.scrollTop = activeText.offsetTop - logText.clientHeight + activeText.clientHeight;

	logContainer.style.opacity = 1;
	event.stopPropagation();
});

logContainer.addEventListener("click", event => {
	logContainer.style.opacity = 0;
	event.stopPropagation();
});
logContainer.addEventListener("transitionend", event => {
	if (event.target != logContainer) return;
	if (logContainer.style.opacity == 0) {
		logContainer.style.display = "none";
	}
});

log.addEventListener("click", event => {
	event.stopPropagation();
});

// Autoボタン
autoTextBtn.addEventListener("click", event => {
	event.stopPropagation();
	if (nextText == null) return;

	logContainer.style.opacity = 0;

	// テキスト音声再生中の場合、自動でテキストを進める時間を残りの再生時間にする
	let sec;
	if (!audios.snd.paused) {
		sec = audios.snd.duration - audios.snd.currentTime;
	}

	isAutoText = true;
	logBtn.textContent = "▶";
	autoNextText(sec);
});

// Closeボタン
logCloseBtn.addEventListener("click", event => {
	logContainer.style.opacity = 0;
	event.stopPropagation();
});

//
// 各種サイズ・位置自動調整
//
const visualContainer = document.getElementById("visualContainer");
const visualContainerSub = document.getElementById("visualContainerSub");
let visualAspect;

function adjustSize(visual) {
	if (visualAspect != null) return;

	visual = visual.querySelector(":scope > *[src]:not([src=''])");
	if (visual == null) return;
	if (visual.tagName == "IMG") {
		visualAspect = visual.naturalWidth / visual.naturalHeight;
	} else {
		visualAspect = visual.videoWidth / visual.videoHeight;
	}

	(new ResizeObserver(() => {
		// 表示枠
		const viewWidth = Math.max(window.innerWidth, 300);
		const viewHeight = Math.max(window.innerHeight, 300);
		const viewAspect = viewWidth / viewHeight;

		// 視覚枠
		let visualWidth, visualHeight, visualTop, visualLeft;
		if (visualAspect < viewAspect) {
			// 画面が横長(左右に余白)
			visualWidth = Math.max(viewHeight * visualAspect, 300);	// 最低サイズ未満の場合、アスペクト比が変わってもテキスト枠の幅確保を優先
			visualHeight = viewHeight;
			visualLeft = (viewWidth - visualWidth) / 2;
			visualTop = 0;
		} else {
			// 画面が縦長(上下に余白)
			visualWidth = viewWidth;
			visualHeight = viewWidth / visualAspect;	// テキスト幅には影響しないため、最低サイズは設けない
			visualLeft = 0;
			visualTop = (viewHeight - visualHeight) / 2;
		}
		visualContainerSub.style.width = visualWidth + "px";
		visualContainerSub.style.height = visualHeight + "px";
		visualContainerSub.style.top = visualTop + "px";
		visualContainerSub.style.left = visualLeft + "px";

		// テキスト枠
		const textHeight = viewHeight * 0.2;
		const textTop = Math.min(viewHeight * 0.8, visualHeight + visualTop);
		textContainer.style.width = visualContainerSub.style.width;
		textContainer.style.height = textHeight + "px";
		textContainer.style.top = textTop + "px";
		textContainer.style.left = visualContainerSub.style.left;

		// テキスト
		const fontSize = Math.max(visualWidth / 65, 20);
		text.style.width = (visualWidth * 0.85) + "px";
		text.style.fontSize = fontSize + "px";

		// ログボタン
		logBtn.style.width = logBtn.style.height = logBtn.style.lineHeight = text.style.fontSize;
		logBtn.style.top = (textHeight + textTop - fontSize * 1.3) + "px";
		logBtn.style.left = (visualWidth + visualLeft - fontSize * 1.3) + "px";
		logBtn.style.fontSize = (fontSize * 0.5) + "px";

		// ログ
		log.style.width = text.style.width;
		log.style.fontSize = text.style.fontSize;
	})).observe(visualContainer);
}
</script>
<script src="novel.js"></script>
<script>
//
// 初期処理
//
const scripts = [];
{
	const scriptLines = scriptText.split("\n");
	scriptText = null;	// 不要なのでクリアする

	const nodeOrg = logText.firstElementChild.cloneNode(true);
	logText.firstElementChild.remove();

	const texts = [];
	let textNo = 0;
	for (let script of scriptLines) {
		if (script.length >= 2 && script.startsWith("/")) {
			// "/"始まる2文字以上は予約語とする
			scripts.push(script);
		} else if (script.endsWith('/')) {
			// "/"で終わる場合は、次の行に続く複数行テキストとする
			texts.push(script.substring(0, script.length - 1));
		} else {
			if (script != "") {
				texts.push(script);
			}
			if (texts.length > 0) {
				scripts.push(texts.join("<br>"));
				texts.length = 0;

				// ログに追加
				const node = nodeOrg.cloneNode(true);
				node.dataset.no = scripts.length - 1;
				node.querySelector(".no").textContent = ++textNo;
				setSafeHtml(node.querySelector(".text"), getTextSnd(scripts[scripts.length - 1]).text);
				logText.appendChild(node);
			}
		}
	}

	for (let elem of logText.querySelectorAll(":scope > li")) {
		elem.addEventListener("click", event => {
			event.stopPropagation();
			if (nextText == null) return;

			// テキストを指定の位置に移動
			nextText(parseInt(elem.dataset.no));

			logContainer.style.opacity = 0;
		});
	}
}

//
// 実行
//
const startBtn = document.getElementById("startBtn");
let scriptIndex = 0;
let startIndex;

(async () => {
	let activeIndex = -1;

	for (;;) {
		// Startボタン
		if (scriptIndex >= scripts.length || scripts[scriptIndex].startsWith("/start") && startIndex == null) {
			if (startIndex == null) {
				startIndex = scriptIndex;
			} else {
				scriptIndex = startIndex;
			}

			startBtn.style.display = "block";
			startBtn.style.pointerEvents = "auto";
			await new Promise(resolve => {
				startBtn.addEventListener("click", event => {
					event.stopPropagation();
					resolve();
				}, {once: true});
			});
			startBtn.style.display = "none";
			visualContainerSub.style.filter = "none";
			logBtn.style.display = "block";
		}

		// 音声
		const bgmText = getChangeStateText(scriptIndex, "/bgm:");
		if (bgmText) {
			const file = bgmText.split(":");
			await setAudio("bgm", file[1], file[2]);
		}
		if (scripts[scriptIndex].startsWith("/snd:")) {
			continueSnd = 2;	// 非同期で実行される2回分のsetTextでsndを停止させないようにする
			const file = scripts[scriptIndex].split(":");
			await setAudio("snd", file[1], file[2]);
		}

		// 視覚
		const visualText = getChangeStateText(scriptIndex, ["/img:", "/video:", "/color:"]);
		if (visualText) {
			const file = visualText.split(":");
			if (file[0] == "/img") {
				await setImg(file[1].split(","), file[2], file[3]);
			} else if (file[0] == "/video") {
				await setVideo(file[1], file[2], file[3] ? true : false);
			} else {
				await setColor(file[1], file[2]);
			}
		}

		// 待機
		if (scripts[scriptIndex].startsWith("/wait:")) {
			const tick = scripts[scriptIndex].substring(6);
			await new Promise(resolve => {
				setTimeout(resolve, tick);
			});
		}

		// ログ
		logText.querySelector(`:scope > [data-no="${activeIndex}"]`)?.classList.remove("active");
		logText.querySelector(`:scope > [data-no="${scriptIndex}"]`)?.classList.add("active");

		activeIndex = scriptIndex;

		if (!scripts[scriptIndex].startsWith("/")) {
			// テキスト
			const newIndex = await setText(scripts[scriptIndex]);
			if (startIndex != null) setText();
			if (newIndex == null) {
				// 1つ進む
				scriptIndex++;
			} else {
				// 指定の位置に移動
				scriptIndex = newIndex;
			}
		} else {
			// 1つ進む
			scriptIndex++;
		}
	}

	// 進む・戻るを考慮した状態変化ありの文字列を返す
	function getChangeStateText(index, str) {
		let text = getChangeStateTextSub(activeIndex, index, str);
		if (text == null) return null;	// 状態変化なしだった

		if (activeIndex < index) return text;	// 進む場合、状態変化ありの文字列を返す

		// 戻る場合は戻り先以前の状態変化の文字列を取得。取得できない場合、strをそのまま返す
		text = getChangeStateTextSub(index + 1, 0, str);
		return text == null ? str : text;
	}

	// fromIndex±1～toIndexの間にstrで始まる文字列があったら状態変化ありのため、その文字列を返す
	// 状態変化なしの場合、nullを返す
	function getChangeStateTextSub(fromIndex, toIndex, str) {
		if (typeof(str) == "string") str = [str];

		if (fromIndex < toIndex) {
			// 進む場合、toIndexから遡る
			for (let i = toIndex; i > fromIndex; i--) {
				if (str.some(v => scripts[i].startsWith(v))) return scripts[i];
			}
		} else {
			// 戻る場合、fromIndex-1から遡る
			for (let i = fromIndex - 1; i >= toIndex; i--) {
				if (str.some(v => scripts[i].startsWith(v))) return scripts[i];
			}
		}
		return null;
	}
})();
</script>
</body>
</html>
